    <main class="skjema-container">
        <div class="hent-kort">
            <h1>Finn din reservasjon</h1>
            <p class="skjema-subtittel">Skriv inn bestillingsnummeret ditt for å se detaljene om bordreservasjonen.</p>

            <form id="hentForm" novalidate>
                <label for="hentBestillingEl" class="skjult-label">Bestillingsnummer</label>
                <div class="sok-rad">
                    <input type="text" id="hentBestillingEl" inputmode="numeric" autocomplete="off" maxlength="10"
                        placeholder="F.eks. 82854" required>
                    <button type="submit" id="hentKnappEl">Hent Bestilling</button>
                </div>
            </form>

            <div id="resultatBestillingEl" aria-live="polite"></div>
        </div>
